name: Build and Release SpeechPlus TTS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk SpeechPlusTTS-v1.3.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeechPlusTTS-v1.3.0-APK
          path: SpeechPlusTTS-v1.3.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.0
          name: "Speech Plus TTS v1.3.0"
          body: |
            ### Speech Plus TTS v1.3.0 Official Release
            - **Zero-Lag TalkBack Navigation:** Swapped to instant QUEUE_FLUSH with hard cut-off on swipe to eliminate audio delay.
            - **Auto-TTS Target Language Routing:** Pure Latin/English routed to Primary engine; Regional scripts (Devanagari, Hindi, Urdu, etc.) automatically routed to Secondary engine.
            - **Force Speech Rate & Pitch:** Added dedicated persistent checkboxes to enforce custom speech rate and pitch across all apps.
            - **Amplify Volume & Audio Stream Routing:** Enhanced audio loudness and direct routing between Media and Accessibility streams.
            - **Official Community & Support:** Added active WhatsApp helplines (+916260503286, +919303472553), Web Portal, and community links in About page.
            - **In-App Direct Updater:** Seamlessly check for updates and install the latest APK directly from the app interface.
          files: SpeechPlusTTS-v1.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
