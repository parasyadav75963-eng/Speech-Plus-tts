name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SpeechPlusTTS-v1.2.2.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeechPlusTTS-v1.2.2-APK
          path: SpeechPlusTTS-v1.2.2.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.2
          name: "Speech Plus TTS v1.2.2"
          body: |
            ### Speech Plus TTS v1.2.2 Release
            - Added Audio Routing Stream (Media vs TalkBack Accessibility)
            - Added Keep-Alive Mode (Prevents background service killing)
            - Added Amplify Speech Volume (Boost output)
            - Added In-App Automatic Updater & Direct APK Installer
            - Optimized Smart Dual/Mixed Engine switching latency
          files: SpeechPlusTTS-v1.2.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
