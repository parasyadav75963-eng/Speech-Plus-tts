name: Build and Release SpeechPlus TTS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SpeechPlusTTS-v1.3.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeechPlusTTS-v1.3.0-APK
          path: SpeechPlusTTS-v1.3.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.0
          name: "Speech Plus TTS v1.3.0"
          body: |
            ### Speech Plus TTS v1.3.0 Release Notes
            - Zero-Lag TalkBack Navigation (QUEUE_FLUSH & instant engine cutoff)
            - Auto-TTS Target Language Routing (Latin vs Regional scripts)
            - Force Speech Rate & Pitch toggle controls
            - Updated Community Support channels & WhatsApp assistance
            - In-App Direct APK Updater support
          files: SpeechPlusTTS-v1.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
