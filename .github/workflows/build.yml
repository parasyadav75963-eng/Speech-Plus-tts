name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SpeechPlusTTS-v1.2.1.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeechPlusTTS-v1.2.1-APK
          path: SpeechPlusTTS-v1.2.1.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.1
          name: "Speech Plus TTS v1.2.1"
          body: |
            ### Speech Plus TTS v1.2.1 Release
            - Added Mode Selection (Single, Dual Language, Mix Mode)
            - Added Force Speech Rate & Force Pitch customization
            - Fixed character-by-character typing echo (spelling reading)
            - Revamped About screen with buttons and official contact email
          files: SpeechPlusTTS-v1.2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
