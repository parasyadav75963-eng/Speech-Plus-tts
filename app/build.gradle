plugins {
    id 'com.android.application'
}

android {
    namespace 'com.speechplus.tts'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.speechplus.tts"
        minSdk 21
        targetSdk 34
        versionCode 15
        versionName "1.5.3"
    }

    signingConfigs {
        release {
            storeFile file('speechplus.jks')
            storePassword 'speechplus123'
            keyAlias 'speechplus'
            keyPassword 'speechplus123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
